name: Auto Restart Pterodactyl Server

on:
  push:
    branches:
      - main  # または master (プッシュを検知したいブランチ)

jobs:
  restart-server:
    runs-on: ubuntu-latest
    steps:
      - name: Trigger Pterodactyl Server Restart
        run: |
          curl -X POST "${{ secrets.PTERO_URL }}/api/client/servers/${{ secrets.PTERO_SERVER_ID }}/power" \
            -H "Authorization: Bearer ${{ secrets.PTERO_API_KEY }}" \
            -H "Accept: application/json" \
            -H "Content-Type: application/json" \
            -d '{"signal": "restart"}'